# CI validates, Mergify merges.
#
# Two positive gates required: the automated review verdict check AND the
# `human-reviewed` label. Guard labels (do-not-merge / needs-human /
# maintainer:hold / crew-gate:hold) stop the queue. Required status checks
# are listed below.
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
- name: reviewed
  batch_size: 1
  merge_method: squash
  update_method: merge
  branch_protection_injection_mode: queue
  queue_conditions:
  - base=main
  - -draft
  - check-success=@sharp-resolver/crew-verdict
  - label=human-reviewed
  - -label=do-not-merge
  - -label=needs-human
  - -label=maintainer:hold
  - -label=crew-gate:hold
  - check-success=ubuntu-latest (devel)
  - check-success=ubuntu-latest (release)
  - check-success=ubuntu-latest (oldrel-1)
pull_request_rules:
- name: Queue resolver-approved changes
  conditions:
  - base=main
  - -draft
  - check-success=@sharp-resolver/crew-verdict
  - label=human-reviewed
  - -label=do-not-merge
  - -label=needs-human
  - -label=maintainer:hold
  - -label=crew-gate:hold
  actions:
    queue: {}

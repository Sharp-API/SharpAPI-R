# R CMD check --as-cran, which had no way to run before this existed: R is not
# installed on the dev box and the repo had no .github/ at all, so issue #1's
# step 3 ("run R CMD check --as-cran on r-devel") was unactionable. Running it
# here rather than installing R locally also keeps it off a box that sits near
# its disk ceiling.
#
# r-devel is included deliberately: CRAN checks submissions against it, and it
# is where a NOTE that blocks acceptance usually appears first.
#
# man/ is committed (R CMD build does not run roxygen, so a tarball built from
# a repo without man/ has no documentation at all and CRAN rejects it). The
# roxygenise step below is therefore a freshness CHECK, not a generator.
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: 'devel', http-user-agent: 'release' }
          - { os: ubuntu-latest, r: 'release' }
          - { os: ubuntu-latest, r: 'oldrel-1' }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config['http-user-agent'] }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2
          needs: check

      # man/, NAMESPACE and DESCRIPTION's roxygen2 version field are roxygen
      # output and are all committed. Re-run roxygenise and fail if anything
      # changed: that means the committed docs are stale relative to the
      # roxygen comments in R/. Only on the release leg -- an older/newer
      # roxygen2 on another leg would produce spurious diffs.
      - name: Check committed documentation is current
        if: matrix.config.r == 'release'
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Committed documentation is stale. Run roxygen2::roxygenise() locally and commit the result."
            echo "--- git status --porcelain ---"
            git status --porcelain
            echo "--- git diff ---"
            git --no-pager diff
            exit 1
          fi
          echo "Committed documentation is up to date."
        shell: bash

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
          upload-snapshots: true

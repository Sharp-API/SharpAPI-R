# Builds the exact tarball that gets uploaded to CRAN, and hands it back as a
# downloadable artifact.
#
# Run it from the Actions tab (workflow_dispatch), download the `cran-tarball`
# artifact, then submit at https://cran.r-project.org/submit.html. CRAN emails a
# confirmation link to the maintainer address in DESCRIPTION (hello@sharpapi.io);
# that click is a human step and cannot be automated away.
name: Build CRAN tarball

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2
          needs: check

      # Guard against submitting a tarball whose docs do not match the source.
      # R CMD build does NOT run roxygen, which is exactly how this package
      # previously ended up with no man/ in the tarball while CI was green.
      - name: Check committed documentation is current
        run: |
          roxygen2::roxygenise()
          if (length(system("git status --porcelain", intern = TRUE)) > 0) {
            cat(system("git status --porcelain", intern = TRUE), sep = "\n")
            stop("man/ is stale: re-run roxygenise() and commit before building for CRAN")
          }
        shell: Rscript {0}

      - name: R CMD build
        run: R CMD build .

      # Check the built tarball against CRAN requirements before submission.
      - name: R CMD check --as-cran on the built tarball
        run: |
          TARBALL=$(ls -1 *.tar.gz | head -n1)
          echo "checking $TARBALL"
          R CMD check --no-manual --as-cran "$TARBALL"

      - name: Show the check log
        if: always()
        run: cat *.Rcheck/00check.log || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cran-tarball
          path: "*.tar.gz"
          if-no-files-found: error
          retention-days: 30
